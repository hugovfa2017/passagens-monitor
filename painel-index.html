<meta name="dash-one-writer">
<style>
  /* Painel por grupo de viajantes: a opção recomendada de cada trecho em destaque e, abaixo, a tabela data x aeroporto.
     Um destaque só (verde-mar) para a recomendada e os links; o resto vem dos tokens do tema. */
  .pn {
    --pn-acc: #17736c;
    --pn-link: color-mix(in oklab, var(--pn-acc) 72%, var(--color-fg));
    --pn-tint: color-mix(in oklab, var(--pn-acc) 9%, var(--color-panel));
    --pn-line: var(--color-border-line);
    --pn-muted: var(--color-fg-muted);
    display: grid; gap: calc(var(--cds-gap-xl) * 1.4);
    font-family: var(--font-anthropic-sans); font-variant-numeric: tabular-nums; color: var(--color-fg);
  }
  .pn h1, .pn h2, .pn h3, .pn p { margin: 0; }
  .pn h1 { font-size: var(--cds-font-size-title); font-weight: 650; letter-spacing: -0.015em; }
  .pn h2 { font-size: calc(var(--cds-font-size-heading) * 1.12); font-weight: 650; letter-spacing: -0.01em; }
  .pn h3 { font-size: var(--cds-font-size-body); font-weight: 600; }
  .pn a { color: var(--pn-link); text-underline-offset: 2px; }
  .pn-meta, .pn-note { font-size: var(--cds-font-size-caption); color: var(--pn-muted); line-height: 1.5; max-width: 80ch; }
  .pn-alerta { padding: var(--cds-pad-md) var(--cds-pad-lg); border-radius: 10px; background: var(--pn-tint); border: 1px solid var(--pn-line); font-weight: 550; }
  .pn-grupos { display: grid; gap: var(--cds-gap-xl); }
  .pn-grupo { display: grid; gap: var(--cds-gap-lg); padding: var(--cds-pad-lg); border-radius: 12px; background: var(--color-panel); border: 1px solid var(--pn-line); min-width: 0; }
  .pn-trecho { display: grid; gap: var(--cds-gap-sm); min-width: 0; }
  .pn-op { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: var(--cds-font-size-body); }
  .pn-op b { font-size: 1.15em; }
  .pn-op.rec b { color: var(--pn-acc); }
  .pn-selo { font-size: var(--cds-font-size-caption); color: var(--pn-muted); }
  .pn-rola { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .pn table { border-collapse: collapse; font-size: var(--cds-font-size-caption); min-width: 100%; }
  .pn th, .pn td { padding: 5px 9px; text-align: right; border-bottom: 1px solid var(--pn-line); white-space: nowrap; }
  .pn th:first-child, .pn td:first-child { text-align: left; position: sticky; left: 0; background: var(--color-panel); }
  .pn th { font-weight: 600; color: var(--pn-muted); }
  .pn td.conf { font-weight: 650; }
  .pn td.lista { color: var(--pn-muted); }
  .pn td.melhor { background: var(--pn-tint); color: var(--pn-acc); }
  .pn-pacote { font-size: var(--cds-font-size-body); }
</style>

<div class="pn">
  <header>
    <h1>Passagens Nordeste</h1>
    <p class="pn-meta" data-draw="meta">Carregando…</p>
  </header>
  <div data-draw="alerta"></div>
  <div class="pn-grupos" data-draw="grupos"></div>
  <p class="pn-note" data-draw="rodape"></p>
</div>

<script>
  const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const painel = () => { const d = dash.data('painel'); return d.status === 'ok' ? d.data : null; };
  const tipo = (t) => (painel() || []).filter((r) => r.tipo === t);
  const resumo = () => tipo('resumo')[0] || null;
  const h = (tag, cls, ...filhos) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    for (const f of filhos) if (f != null) e.append(f);
    return e;
  };
  // só aceita link http(s): o texto vem de sites de terceiros
  const seguro = (u) => (/^https?:\/\//.test(u || '') ? u : null);
  const link = (href, txt) => { const u = seguro(href); if (!u) return h('span', null, txt); const a = h('a', null, txt); a.href = u; a.target = '_blank'; a.rel = 'noopener'; return a; };
  const lugar = (c) => ((resumo().aeroportos[c] || {}).curto || c);
  const vendedor = (v) => (v || '').replace(/^CIA /, '').replace(/^maxmilhas$/i, 'MaxMilhas');
  const hora = (s) => (s || '').replace(':', 'h');

  const opcao = (o, cls, rotulo, alvo) => h('div', 'pn-op ' + cls,
    h('span', null, rotulo),
    h('b', null, (alvo && o.pp <= alvo ? '✅ ' : '') + BRL.format(o.pp)),
    h('span', null, `${o.dia} ${hora(o.saida)} · ${lugar(o.orig)} → ${lugar(o.dest)} · ${o.cia} ${o.tipo}`),
    link(o.link, 'comprar na ' + vendedor(o.vend)));

  // o que muda no preço por pessoa com outro número de lugares no mesmo voo (dif = 0: mesmo preço)
  const lugares = (difs, pax) => {
    const mais = difs.filter((x) => x.n > pax), um = difs.find((x) => x.n === 1 && pax > 1 && x.dif < 0), partes = [];
    if (mais.length) partes.push('👥 comprando juntos nesse voo: ' + mais.map((x) => `${x.n} lugares, ` +
      (x.dif ? `${x.dif > 0 ? '+' : '−'}${BRL.format(Math.abs(x.dif))} por pessoa` : 'mesmo preço por pessoa')).join(' · '));
    if (um) partes.push(`✂️ 1 lugar sozinho sai ${BRL.format(-um.dif)} mais barato: comprar um de cada vez, em reservas separadas, economiza ${BRL.format(-um.dif)} no total`);
    return partes.map((t) => h('p', 'pn-selo', t));
  };

  // ida e volta numa compra só, quando sai mais barato que as duas recomendadas separadas
  const juntas = (p, g, varios) => {
    const j = p.juntas, perna = (o) => `${o.dia} ${hora(o.saida)} ${lugar(o.orig)} → ${lugar(o.dest)}, ${o.cia} ${o.tipo}`;
    return h('p', 'pn-pacote', '🔁 ', varios ? `${p.nome}: ` : '', j.mesmos ? 'os mesmos voos numa compra só: ' : 'ida e volta numa compra só, em outros voos: ',
      h('b', null, BRL.format(j.pp)), g.assentos > 1 ? ' por pessoa' : '', ` (${BRL.format(j.economia)} a menos) · `, link(j.link, 'ver na ' + vendedor(j.vend)),
      j.mesmos ? '' : ` · ida ${perna(j.ida)} · volta ${perna(j.volta)}`);
  };

  // tabela data x aeroporto do Nordeste; negrito = preço confirmado, cinza = preço da lista do Google (pode mudar)
  const tabela = (serie, ordem) => {
    const cel = tipo('celula').filter((c) => c.serie === serie);
    if (!cel.length) return null;
    const datas = [...new Set(cel.map((c) => c.d))].sort(), aps = ordem.filter((a) => cel.some((c) => c.ne === a));
    const confirmados = cel.filter((c) => c.conf).map((c) => c.pp), menor = confirmados.length ? Math.min(...confirmados) : null;
    const t = h('table', null, h('thead', null, h('tr', null, h('th', null, 'Data'), ...aps.map((a) => h('th', null, lugar(a))))));
    const corpo = h('tbody');
    for (const d of datas) {
      const tr = h('tr', null, h('td', null, cel.find((c) => c.d === d).dia));
      for (const a of aps) {
        const c = cel.find((x) => x.d === d && x.ne === a);
        tr.append(h('td', c ? (c.conf ? 'conf' : 'lista') + (c.conf && c.pp === menor ? ' melhor' : '') : null, c ? BRL.format(c.pp) : '·'));
      }
      corpo.append(tr);
    }
    t.append(corpo);
    return h('div', 'pn-rola', t);
  };

  dash.draw('meta', (el) => {
    const r = resumo();
    if (!r) { el.textContent = dash.data('painel').status === 'error' ? 'Não consegui carregar os dados.' : 'Carregando…'; return; }
    const q = r.quando;
    el.textContent = `Preço por pessoa, sem mala. Atualizado em ${q.slice(8, 10)}/${q.slice(5, 7)} às ${q.slice(11, 16)}; nova busca de hora em hora.`;
  });

  dash.draw('alerta', (el) => {
    const r = resumo();
    el.replaceChildren(...(r && r.alerta ? [h('p', 'pn-alerta', r.alerta)] : []));
  });

  dash.draw('grupos', (el) => {
    const r = resumo();
    if (!r) { el.replaceChildren(); return; }
    const trechos = tipo('trecho'), pacotes = tipo('pacote'), sigla = Object.fromEntries(r.grupos.map((g) => [g.id, g.rotulo]));
    el.replaceChildren(...r.grupos.map((g) => {
      const sec = h('section', 'pn-grupo', h('h2', null, `${g.emoji} ${g.rotulo}` + (g.assentos > 1 ? ` · ${g.assentos} lugares juntos` : '')));
      for (const t of trechos.filter((x) => x.grupo === g.id)) {
        const bloco = h('div', 'pn-trecho', h('h3', null, `${t.nome} · ${t.janela}`));
        if (t.igual_a) {
          bloco.append(t.recomendada ? opcao(t.recomendada, '', `no voo de ${sigla[t.igual_a.split('.')[0]]}`, t.alvo) : h('p', 'pn-note', 'Sem preço confirmado.'));
        } else {
          bloco.append(t.recomendada ? opcao(t.recomendada, 'rec', '⭐ recomendada', t.alvo) : h('p', 'pn-note', 'Sem preço confirmado na última busca.'));
          if (t.mais_barata) bloco.append(opcao(t.mais_barata, '', '💸 mais barata', t.alvo));
          if (t.comprado) bloco.append(opcao(t.comprado, '', '🎯 no voo já comprado', t.alvo));
          bloco.append(...lugares(t.lugares || [], t.pax));
          if (t.alvo) bloco.append(h('p', 'pn-selo', `Alvo: ${BRL.format(t.alvo)} por pessoa`));
          const tab = tabela(t.serie, r.ordem);
          if (tab) bloco.append(tab);
        }
        sec.append(bloco);
      }
      const meus = pacotes.filter((p) => p.grupo === g.id);
      if (meus.length) {
        const menor = Math.min(...meus.map((p) => p.pp));
        sec.append(h('p', 'pn-pacote', '📦 ida + volta: ', ...meus.flatMap((p, i) => [i ? ' · ' : '',
          meus.length > 1 ? `${p.id} ` : '', p.pp === menor ? h('b', null, BRL.format(p.pp)) : BRL.format(p.pp)]),
          g.assentos > 1 ? ` por pessoa (${BRL.format(menor * g.assentos)} no total)` : ''));
        sec.append(...meus.filter((p) => p.juntas).map((p) => juntas(p, g, meus.length > 1)));
      }
      return sec;
    }));
  });

  dash.draw('rodape', (el) => {
    const r = resumo();
    if (!r) { el.textContent = ''; return; }
    const ultimos = r.ordem.filter((c) => (r.aeroportos[c] || {}).ultimo_caso);
    const partes = ['⭐ = a mais barata levando em conta a ordem de preferência: ' + r.ordem.filter((c) => !ultimos.includes(c)).map(lugar).join(', ')
      + (ultimos.length ? `; ${ultimos.map(lugar).join(' e ')} só em último caso.` : '.'),
      'Na tabela, negrito é preço confirmado na tela de compra; cinza é o preço da lista do Google, que pode mudar.'];
    if (r.mossoro && r.mossoro.buscas && !r.mossoro.voos) partes.push('Mossoró: nenhum voo à venda nas datas buscadas.');
    const mala = Object.entries(r.taxa_mala || {});
    if (mala.length) partes.push('Mala de 23 kg, por trecho: ' + mala.map(([c, v]) => `${c} +${BRL.format(v)}`).join(', ') + '.');
    el.textContent = partes.join(' ');
  });
</script>

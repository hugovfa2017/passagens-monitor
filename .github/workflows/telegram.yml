name: Teste do Telegram

on:
  workflow_dispatch:          # botão "Run workflow": manda uma mensagem de teste com os segredos do GitHub
  push:
    branches: [main]
    paths: ['.github/workflows/telegram.yml']

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mandar mensagem de teste
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import os, json, urllib.request, registrar
          me = json.load(urllib.request.urlopen(f'https://api.telegram.org/bot{registrar._token()}/getMe', timeout=30))['result']['username']
          print('bot: @' + me, '| destinatários:', len(registrar._chats()))
          " || echo "token não aceito pelo Telegram"
          r=$(python3 registrar.py --teste-telegram)
          echo "$r"
          [ "$r" = "TELEGRAM_ENVIADO" ]

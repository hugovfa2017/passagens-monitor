name: Monitor PS5

on:
  schedule:
    - cron: '41 * * * *'      # de hora em hora (o agendamento do GitHub às vezes atrasa ou pula uma)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:                       # roda também quando o código do monitor muda (não quando só os dados mudam)
    branches: [main, claude/ps5-price-monitor-brazil-cqvxiw]
    paths: ['ps5/*.py', 'ps5/painel.html', '.github/workflows/ps5.yml']

permissions:
  contents: write             # para guardar histórico e painel de volta no repositório

concurrency:
  group: ps5
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auto-checagem
        run: python ps5/monitor.py --teste
      - name: Varredura e alerta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_PS5: ${{ secrets.TELEGRAM_CHAT_ID_PS5 }}
          PS5_ENVIAR: ${{ github.ref_name == 'main' && '1' || '0' }}   # fora da main, não manda Telegram
        run: python ps5/monitor.py
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "monitor-ps5"
          git config user.email "monitor-ps5@users.noreply.github.com"
          git add ps5/historico.csv ps5/estado.json ps5/ultimo.md docs/ps5 2>/dev/null || true
          git commit -q -m "PS5 $(date '+%d/%m %H:%M')" || { echo "nada novo"; exit 0; }
          # o monitor de passagens também grava na main: junta e tenta de novo se alguém gravou antes
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 7))
          done
          exit 1

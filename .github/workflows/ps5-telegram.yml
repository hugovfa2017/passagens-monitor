name: Teste do Telegram (PS5)

on:
  workflow_dispatch:          # botão "Run workflow": manda uma mensagem de teste pelo bot do PS5
  push:                       # provisório: o botão só existe depois que o arquivo chega à main; até lá, mexer aqui roda o teste
    branches: [claude/ps5-price-monitor-brazil-cqvxiw]
    paths: ['.github/workflows/ps5-telegram.yml']

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Onde está o token do bot (só sim ou não, nunca o valor)
        env:
          SEGREDO_TELEGRAM_TOKEN_PS5: ${{ secrets.TELEGRAM_TOKEN_PS5 != '' }}
          SEGREDO_PS5_TOKEN: ${{ secrets.PS5_TOKEN != '' }}
          SEGREDO_TOKEN_PS5: ${{ secrets.TOKEN_PS5 != '' }}
          SEGREDO_PS5_BOT_TOKEN: ${{ secrets.PS5_BOT_TOKEN != '' }}
          VARIAVEL_TELEGRAM_TOKEN_PS5: ${{ vars.TELEGRAM_TOKEN_PS5 != '' }}
          VARIAVEL_PS5_TOKEN: ${{ vars.PS5_TOKEN != '' }}
          VARIAVEL_TOKEN_PS5: ${{ vars.TOKEN_PS5 != '' }}
        # token salvo em "Variables" não serve: variável aparece no log, e este repositório é público
        run: env | grep -E '^(SEGREDO|VARIAVEL)_' | sort
      - name: Mandar mensagem de teste pelo bot do PS5
        env:
          TELEGRAM_TOKEN_PS5: ${{ secrets.TELEGRAM_TOKEN_PS5 || secrets.PS5_TOKEN }}   # o segredo pode ter um dos dois nomes
          TELEGRAM_CHAT_ID_PS5: ${{ secrets.TELEGRAM_CHAT_ID_PS5 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # o resultado diz o que falta (segredo ausente, /start não enviado...) sem mostrar token nem id de chat
        run: python3 ps5/monitor.py --teste-telegram

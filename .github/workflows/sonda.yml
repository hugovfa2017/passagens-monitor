name: Sonda dos vendedores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['nuvem/sonda.py', '.github/workflows/sonda.yml']

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: python nuvem/sonda.py
